<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="50" viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pacalaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon background with rounded corners -->
  <rect x="0" y="0" width="50" height="50" rx="12" ry="12" fill="url(#pacalaGradient)"/>

  <!-- Letter P -->
  <text x="25" y="36"
        font-family="Montserrat, Arial Black, sans-serif"
        font-size="32"
        font-weight="800"
        fill="white"
        text-anchor="middle">P</text>

  <!-- Pacala text -->
  <text x="62" y="24"
        font-family="Montserrat, Arial Black, sans-serif"
        font-size="18"
        font-weight="800"
        fill="#1e3a8a">Pacala</text>

  <!-- Group text -->
  <text x="62" y="44"
        font-family="Montserrat, Arial Black, sans-serif"
        font-size="18"
        font-weight="800"
        fill="#3b82f6">Group</text>
</svg>
