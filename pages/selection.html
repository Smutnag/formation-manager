<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="THE VILLAGE - Selection du restaurant">
  <title>THE VILLAGE - Selection restaurant</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Nunito:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">

  <style>
    /* Styles specifiques a la page de selection */
    .selection-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-xl);
    }

    .selection-village-logo {
      font-family: var(--font-logo);
      font-size: 42px;
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
    }

    .selection-welcome {
      font-size: var(--font-size-h2);
      color: var(--text-secondary);
    }

    .selection-welcome .user-name {
      color: var(--text-primary);
      font-weight: var(--font-weight-semibold);
    }

    .selection-subtitle {
      font-size: var(--font-size-body);
      color: var(--text-light);
      margin-top: var(--spacing-3xl);
      margin-bottom: var(--spacing-lg);
    }

    .restaurant-card .restaurant-icon {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--spacing-xl);
      transition: transform var(--transition-normal);
    }

    .restaurant-card:hover .restaurant-icon {
      transform: scale(1.1);
    }

    .restaurant-card.card-vegas .restaurant-icon {
      background-color: var(--color-vegas-light);
      color: var(--color-vegas);
    }

    .restaurant-card.card-crepe .restaurant-icon {
      background-color: var(--color-crepe-light);
      color: var(--color-crepe);
    }

    .restaurant-card.card-rentabilite .restaurant-icon {
      background-color: var(--color-rentabilite-light);
      color: var(--color-rentabilite);
    }

    .restaurant-card .restaurant-icon svg {
      width: 40px;
      height: 40px;
    }

    .restaurant-card .restaurant-name {
      font-size: var(--font-size-h2);
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
      margin-bottom: var(--spacing-sm);
    }

    .restaurant-card .restaurant-description {
      font-size: var(--font-size-small);
      color: var(--text-secondary);
    }

    .selection-footer {
      margin-top: var(--spacing-4xl);
      text-align: center;
    }

    .logout-link {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-sm);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: var(--font-size-small);
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-md);
      transition: all var(--transition-fast);
    }

    .logout-link:hover {
      color: var(--text-primary);
      background-color: var(--bg-secondary);
    }
  </style>
</head>
<body class="theme-neutral">
  <div class="page-selection">

    <!-- Header avec logo Pacala -->
    <div class="selection-header animate-fade-in">
      <div class="selection-logo">
        <!-- Logo Pacala Group -->
        <div class="pacala-logo pacala-logo-sm">
          <div class="pacala-icon">P</div>
          <div class="pacala-text">
            <span class="pacala-name">Pacala</span>
            <span class="pacala-group">Group</span>
          </div>
        </div>

        <!-- Logo THE VILLAGE -->
        <h1 class="selection-village-logo">THE VILLAGE</h1>

        <!-- Message de bienvenue -->
        <p class="selection-welcome">
          Bonjour <span class="user-name" id="userName">Utilisateur</span>
        </p>

        <p class="selection-subtitle">Selectionnez un restaurant pour continuer</p>
      </div>
    </div>

    <!-- Grille de selection -->
    <div class="selection-grid" id="restaurantGrid">
      <!-- Les cartes seront generees dynamiquement -->
    </div>

    <!-- Footer -->
    <div class="selection-footer">
      <a href="#" class="logout-link" id="logoutLink">
        <i data-lucide="log-out" class="icon-sm"></i>
        Deconnexion
      </a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    // Verification de l'authentification
    if (!Auth.isLoggedIn()) {
      window.location.href = 'login.html';
    }

    // Initialisation des icones Lucide
    lucide.createIcons();

    // Recuperation des informations utilisateur
    const session = Auth.getSession();
    document.getElementById('userName').textContent = session.userName;

    // Configuration des restaurants
    const restaurantsConfig = {
      vegas: {
        id: 'vegas',
        name: 'Vegas Kitchen',
        description: 'Gestion du restaurant Vegas',
        icon: 'utensils',
        color: 'vegas'
      },
      crepe: {
        id: 'crepe',
        name: 'La Crepe au Carre',
        description: 'Gestion de la creperie',
        icon: 'cookie',
        color: 'crepe'
      },
      rentabilite: {
        id: 'rentabilite',
        name: 'Rentabilite Globale',
        description: 'Vue consolidee des 2 restaurants',
        icon: 'bar-chart-2',
        color: 'rentabilite'
      }
    };

    // Generation des cartes de restaurants
    const restaurantGrid = document.getElementById('restaurantGrid');
    const accessibleRestaurants = Auth.getAccessibleRestaurants();

    accessibleRestaurants.forEach((restaurant, index) => {
      const config = restaurantsConfig[restaurant.id];
      if (!config) return;

      const card = document.createElement('div');
      card.className = `card restaurant-card card-selectable card-${config.color} animate-fade-in`;
      card.style.animationDelay = `${index * 100}ms`;
      card.dataset.restaurantId = config.id;

      card.innerHTML = `
        <div class="restaurant-icon">
          <i data-lucide="${config.icon}"></i>
        </div>
        <h3 class="restaurant-name">${config.name}</h3>
        <p class="restaurant-description">${config.description}</p>
      `;

      card.addEventListener('click', () => selectRestaurant(config.id));
      restaurantGrid.appendChild(card);
    });

    // Reinitialisation des icones pour les nouvelles cartes
    lucide.createIcons();

    // Selection d'un restaurant
    function selectRestaurant(restaurantId) {
      if (Auth.setRestaurant(restaurantId)) {
        // Redirection selon le type de restaurant
        if (restaurantId === 'rentabilite') {
          window.location.href = 'rentabilite.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      } else {
        alert('Vous n\'avez pas acces a ce restaurant.');
      }
    }

    // Gestion de la deconnexion
    document.getElementById('logoutLink').addEventListener('click', (e) => {
      e.preventDefault();
      Auth.logout();
    });
  </script>
</body>
</html>
